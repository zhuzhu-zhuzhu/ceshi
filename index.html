<h1>DSH Drive Backup</h1>
<p class="sub">个人自用的 Google Drive 备份工具</p>

<p>本应用是一个运行在作者本人设备上的命令行备份工具，通过 Google Drive API 把作者自己的文件同步到作者自己的 Google 云端硬盘。</p>

<ul>
  <li>仅作者本人使用，不对公众开放注册，也不作为服务提供给第三方。</li>
  <li>只访问授权账号本人的云端硬盘文件，不接触其他用户的任何数据。</li>
  <li>不使用分析、广告或跟踪服务。</li>
</ul>

<p>隐私说明见 <a href="privacy.html">隐私政策</a>。</p>
