<h1>DSH Drive Backup</h1>
<p class="sub">Google Drive 文件同步工具</p>

<p>本应用用于在用户自己的设备与 Google 云端硬盘之间同步文件。只有在用户完成 Google 账号授权后，应用才会访问该用户本人的云端硬盘内容。</p>

<ul>
  <li>仅访问授权账号本人的 Drive 文件，不涉及其他任何用户的数据。</li>
  <li>不提供账号注册，不收集个人身份信息。</li>
  <li>不使用分析、广告或跟踪服务。</li>
</ul>

<p>隐私说明见 <a href="privacy.html">隐私政策</a>。</p>
